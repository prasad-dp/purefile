name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Offline egress gate (source scan)
        run: bash tool/egress_check.sh || true
        # The manifest half of the gate runs after the APK build below.

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Verify no INTERNET permission (release manifest)
        run: |
          M=build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if grep -q "uses-permission android:name=\"android.permission.INTERNET\"" "$M"; then
            echo "::error::Release manifest contains INTERNET permission — offline guarantee violated"
            exit 1
          fi
          echo "Release manifest is INTERNET-free ✓"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: purefile-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload arm32 APK
        uses: actions/upload-artifact@v4
        with:
          name: purefile-arm32-apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK (emulators)
        uses: actions/upload-artifact@v4
        with:
          name: purefile-x86_64-apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn

      - name: Upload universal APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: purefile-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

  summary:
    name: Build summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Result
        run: |
          echo "APK build: ${{ needs.build.result }}"
